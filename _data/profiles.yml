# Single source of truth for the external profile links shown on the home page
# (`_tabs/about.md`) and on the contacts page (`_tabs/contact.md`).
#
# Keys:
#   name  - label shown next to the icon
#   icon  - Font Awesome 6 class
#   url   - target; use `mailto:` / `https:` explicitly
#   group - academic | code | social  (contacts page groups by this)
#   home  - true to also show it in the home page hero

- name: Email
  icon: fas fa-envelope
  url: mailto:fbellisardi@ifisc.uib-csic.es
  group: academic
  home: true

- name: Google Scholar
  icon: fa-brands fa-google-scholar
  url: https://scholar.google.com/citations?user=Ba8WR_8AAAAJ&hl=en
  group: academic
  home: true

